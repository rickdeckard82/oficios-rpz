services:
  api:
    build: .
    image: oficios-rpz-app
    container_name: api
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-change-me}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-anatel}:${MYSQL_PASSWORD:-anatel}@db:3306/${MYSQL_DATABASE:-anatel}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-300}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      API_KEY: ${API_KEY:-}
      SSH_HOST: ${SSH_HOST:-}
      SSH_PORT: ${SSH_PORT:-22}
      SSH_USER: ${SSH_USER:-}
      SSH_PASSWORD: ${SSH_PASSWORD:-}
      SSH_KEY_PATH: ${SSH_KEY_PATH:-}
      SSH_KEY_PASSPHRASE: ${SSH_KEY_PASSPHRASE:-}
      SSH_STRICT_HOST_KEY_CHECKING: ${SSH_STRICT_HOST_KEY_CHECKING:-false}
      SUDO_PASSWORD: ${SUDO_PASSWORD:-}
      ROUTER_SSH_HOST: ${ROUTER_SSH_HOST:-10.99.99.8}
      ROUTER_SSH_PORT: ${ROUTER_SSH_PORT:-22}
      ROUTER_SSH_USER: ${ROUTER_SSH_USER:-}
      ROUTER_SSH_PASSWORD: ${ROUTER_SSH_PASSWORD:-}
      ROUTER_SSH_KEY_PATH: ${ROUTER_SSH_KEY_PATH:-}
      ROUTER_SSH_KEY_PASSPHRASE: ${ROUTER_SSH_KEY_PASSPHRASE:-}
      WHOIS_LOOKUP_TIMEOUT_SECONDS: ${WHOIS_LOOKUP_TIMEOUT_SECONDS:-8}
      RPZ_REMOTE_PATH: ${RPZ_REMOTE_PATH:-/var/cache/bind/db.rpz.zone}
      RPZ_RELOAD_COMMAND: ${RPZ_RELOAD_COMMAND:-sudo service bind9 reload}
      RPZ_TEST_RESOLVER: ${RPZ_TEST_RESOLVER:-127.0.0.1}
    expose:
      - "8000"
    volumes:
      - ${HOST_UPLOAD_PATH:-./uploads}:/app/uploads
      - ${HOST_SSH_KEY_PATH:-./ssh/id_rsa}:/run/secrets/bind_ssh_key:ro
    depends_on:
      db:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: frontend
    expose:
      - "80"
    networks:
      default:
      npm_proxy:
        aliases:
          - ${NPM_FRONTEND_ALIAS:-oficios-frontend}
    depends_on:
      api:
        condition: service_started

  whois-worker:
    build: .
    image: oficios-rpz-app
    container_name: whois-worker
    command: python -m app.whois_worker
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-change-me}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-anatel}:${MYSQL_PASSWORD:-anatel}@db:3306/${MYSQL_DATABASE:-anatel}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      WHOIS_LOOKUP_TIMEOUT_SECONDS: ${WHOIS_LOOKUP_TIMEOUT_SECONDS:-8}
      WHOIS_WORKER_INTERVAL_SECONDS: ${WHOIS_WORKER_INTERVAL_SECONDS:-5}
      WHOIS_WORKER_MAX_ATTEMPTS: ${WHOIS_WORKER_MAX_ATTEMPTS:-3}
    depends_on:
      db:
        condition: service_started
      api:
        condition: service_started
    restart: unless-stopped

  db:
    image: mysql:8.4.9
    container_name: db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-anatel}
      MYSQL_USER: ${MYSQL_USER:-anatel}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-anatel}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
    external: true
    name: oficios-rpz_mysql_data

networks:
  npm_proxy:
    external: true
    name: ${NPM_NETWORK_NAME:-nginx-proxy-manager_default}
